<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI Creator Radar</title>
  <meta name="description" content="AI news breaking on X, and whether it has hit YouTube yet. Gaps are video ideas.">
  <meta name="theme-color" content="#07080b">
  <link rel="icon" href="shell/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shell/shell.css">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-opacity=".35"/>
          <circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-opacity=".55"/>
          <path d="M16 16 L27 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="22" cy="12" r="2.2" fill="currentColor"/>
        </svg>
        <div>
          <p class="label">Chase AI · Mission control</p>
          <h1>AI Creator Radar</h1>
        </div>
      </div>
      <p class="tagline">What's breaking on X, and whether YouTube has caught up. A gap is a video idea.</p>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="metrics" id="metrics"></div>
    </header>
    <main class="grid" id="grid"></main>
    <footer class="foot">
      <span class="credit">Built by worker 1 · Shell</span>
      <span class="label">Public data only · X via read-only search · YouTube Data API</span>
    </footer>
  </div>
  <script type="module" src="shell/app.js"></script>
</body>
</html>
