name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  data:
    name: Data matches schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "jsonschema[format]==4.23.0"
      - run: python3 shell/tools/validate.py
  secrets:
    name: No keys, tokens or cookies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 shell/tools/no_secrets.py
  worker-tests:
    name: Worker unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run each worker folder's tests (python3 -m unittest, stdlib only)
        run: |
          found=0
          for d in x radar youtube ops; do
            if [ -d "$d/tests" ]; then found=1; echo "== $d"; python3 -m unittest discover -s "$d/tests" -t . -v; fi
          done
          [ "$found" = 1 ] || echo "no worker tests yet"
  smoke:
    name: Page renders on phone and desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node shell/tests/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shell/tests/out/
